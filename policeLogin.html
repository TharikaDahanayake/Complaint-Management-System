<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Police Login</title>
	<link rel="stylesheet" href="css/style.css">
	<style>
		body {
			margin: 0;
			background:
				linear-gradient(135deg, rgba(7, 29, 67, 0.96), rgba(30, 58, 138, 0.9));
				
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 28px;
			box-sizing: border-box;
		}

		.login-shell {
			width: min(100%, 980px);
			min-height: 590px;
			display: grid;
			grid-template-columns: 0.95fr 1.05fr;
			background: rgba(255, 255, 255, 0.98);
			border: 1px solid rgba(255, 255, 255, 0.4);
			border-radius: 24px;
			overflow: hidden;
			box-shadow: 0 24px 70px rgba(4, 20, 52, 0.35);
		}

		.login-intro {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 48px 42px;
			text-align: center;
			color: #ffffff;
			background:
				linear-gradient(155deg, rgba(8, 43, 93, 0.94), rgba(16, 79, 135, 0.94)),
				url("assets/images/Logo.jpg") center / cover;
		}

		.login-intro::after {
			content: "";
			position: absolute;
			width: 220px;
			height: 220px;
			right: -90px;
			bottom: -90px;
			border: 30px solid rgba(255, 255, 255, 0.08);
			border-radius: 50%;
		}

		.brand-mark {
			position: relative;
			z-index: 1;
			width: 160px;
			height: 160px;
			object-fit: cover;
			border: 5px solid rgba(255, 255, 255, 0.9);
			border-radius: 50%;
			box-shadow: 0 12px 26px rgba(0, 0, 0, 0.2);
			background: #ffffff;
		}

		.login-intro h1 {
			position: relative;
			z-index: 1;
			margin: 26px 0 10px;
			font-size: clamp(27px, 4vw, 38px);
			letter-spacing: 1px;
		}

		.login-intro p {
			position: relative;
			z-index: 1;
			max-width: 310px;
			margin: 0;
			color: rgba(255, 255, 255, 0.78);
			line-height: 1.65;
			font-size: 15px;
		}

		.login-card {
			display: flex;
			align-items: center;
			padding: 56px clamp(30px, 6vw, 72px);
			background: #ffffff;
			text-align: left;
		}

		.login-card h2 {
			margin: 0 0 8px;
			color: #1E3A8A;
			font-size: 30px;
			letter-spacing: -0.5px;
		}

		.login-card .login-subtitle {
			margin: 0 0 32px;
			color: #64748b;
			font-size: 14px;
		}

		.form-group {
			margin-bottom: 22px;
		}

		.form-group label {
			display: block;
			margin-bottom: 8px;
			font-weight: 600;
			font-size: 13px;
			color: #334155;
			letter-spacing: 0.2px;
		}

		.form-group input {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #d5deed;
			border-radius: 9px;
			box-sizing: border-box;
			color: #172554;
			background: #f8fafc;
			font-size: 15px;
			transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
		}

		.form-group input:focus {
			outline: none;
			border-color: #1E3A8A;
			background: #ffffff;
			box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.12);
		}

		.btn-login {
			width: 100%;
			padding: 13px;
			border: none;
			border-radius: 9px;
			background: linear-gradient(135deg, #1E3A8A, #2563b8);
			color: #ffffff;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.3px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.btn-login:hover {
			background: linear-gradient(135deg, #152d6b, #1E3A8A);
			transform: translateY(-2px);
			box-shadow: 0 8px 18px rgba(30, 58, 138, 0.25);
		}

		.btn-login:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		@media (max-width: 760px) {
			body {
				padding: 16px;
			}

			.login-shell {
				grid-template-columns: 1fr;
				min-height: auto;
			}

			.login-intro {
				padding: 36px 28px;
			}

			.login-intro::after {
				display: none;
			}

			.brand-mark {
				width: 112px;
				height: 112px;
			}

			.login-intro h1 {
				margin-top: 18px;
				font-size: 28px;
			}

			.login-card {
				padding: 38px 28px 42px;
			}
		}
	</style>
</head>
<body>
	<div class="login-shell">
		<section class="login-intro" aria-label="Police complaint management system">
			<img class="brand-mark" src="assets/images/Logo.jpg" alt="Police emblem">
			<h1>Police Portal</h1>

		</section>

		<section class="login-card">
			<div>
				<h2>Welcome back</h2>
				<p class="login-subtitle">Sign in to continue to the police dashboard.</p>

				<form id="loginForm">
			

					<div class="form-group">
						<label for="username">Username</label>
						<input type="text" id="username" name="username" autocomplete="username" required>
					</div>

					<div class="form-group">
						<label for="password">Password</label>
						<input type="password" id="password" name="password" required>
					</div>

					<p id="loginMessage" style="margin: 0 0 14px; font-size: 14px;"></p>

					<button type="submit" class="btn-login">Login</button>
            

				</form>
			</div>
		</section>
	</div>
</body>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
	import {
		getFirestore,
		collection,
		query,
		where,
		limit,
		getDocs
	} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
	import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCr5xSS_xPQO38JHoZMufQl-HEltwCvqSk",
    authDomain: "complaint-management-sys-f5d5e.firebaseapp.com",
    projectId: "complaint-management-sys-f5d5e",
    storageBucket: "complaint-management-sys-f5d5e.firebasestorage.app",
    messagingSenderId: "697751596289",
    appId: "1:697751596289:web:cd218934e92411bd7a7f00"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);
	const auth = getAuth(app);

	const loginForm = document.getElementById("loginForm");
	const usernameInput = document.getElementById("username");
	const passwordInput = document.getElementById("password");
	const loginMessage = document.getElementById("loginMessage");

	function showMessage(text, isSuccess) {
		loginMessage.textContent = text;
		loginMessage.style.color = isSuccess ? "#0f766e" : "#b91c1c";
	}

	loginForm.addEventListener("submit", async (event) => {
		event.preventDefault();

		const username = usernameInput.value.trim().toUpperCase();
		const password = passwordInput.value;
		const loginButton = loginForm.querySelector("button[type='submit']");

		showMessage("", false);
		loginButton.disabled = true;
		loginButton.textContent = "Checking...";

		try {
			const usersRef = collection(db, "users");
			const userQuery = query(
				usersRef,
				where("username", "==", username),
				limit(1)
			);
			const snapshot = await getDocs(userQuery);

			if (snapshot.empty) {
				showMessage("Invalid username or password.", false);
				return;
			}

			if (snapshot.size > 1) {
				showMessage("Duplicate username records found. Contact the system administrator.", false);
				return;
			}

			const userRecord = snapshot.docs[0].data();
			const role = String(userRecord.role || "").toUpperCase();
			const stationID = String(userRecord.stationID || "").trim();
			const authEmail = String(userRecord.authEmail || "").trim().toLowerCase();

			if (userRecord.active !== true || !authEmail || !stationID || !["ADMIN", "OIC"].includes(role)) {
				showMessage("This account is not configured for access.", false);
				return;
			}

			await signInWithEmailAndPassword(auth, authEmail, password);

			const policeStationsRef = collection(db, "police_stations");
			const stationQuery = query(policeStationsRef, where("stationID", "==", stationID), limit(1));
			const stationSnapshot = await getDocs(stationQuery);
			const stationRecord = stationSnapshot.empty ? {} : stationSnapshot.docs[0].data();

			localStorage.setItem("policeStationID", stationID);
			localStorage.setItem("stationName", stationRecord.stationName ?? "");
			localStorage.setItem("policeStationName", stationRecord.stationName ?? "");
			localStorage.setItem("policeUserRole", role);
			localStorage.setItem("policeUsername", username);
			localStorage.setItem("policeAuthEmail", authEmail);

			// Show success alert
			alert("Login Successful! Welcome to the Police Portal.");
			window.location.assign("policeDashboard.html");
		} catch (error) {
			console.error("Login error:", error);
			const authErrorMessages = {
				"auth/invalid-credential": "Incorrect username or password.",
				"auth/user-not-found": "This account does not exist.",
				"auth/wrong-password": "Incorrect password.",
				"auth/invalid-email": "The username is invalid.",
				"auth/network-request-failed": "Network error. Check your internet connection."
			};
			if (error.code === "permission-denied") {
				showMessage("Firestore denied access to the users collection. Update the Firebase rules.", false);
			} else {
				showMessage(authErrorMessages[error.code] || `Login failed (${error.code || "unknown error"}). Check the username and password.`, false);
			}
		} finally {
			loginButton.disabled = false;
			loginButton.textContent = "Login";
		}
	});
</script>



</html>
