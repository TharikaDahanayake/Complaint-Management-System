<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
	<title>Police Login</title>
	<link rel="stylesheet" href="css/style.css">
	<style>
		body {
			background:
				radial-gradient(circle at 10% 10%, rgba(30, 58, 138, 0.18), transparent 34%),
				radial-gradient(circle at 90% 80%, rgba(30, 58, 138, 0.12) 0, transparent 35%),
				linear-gradient(120deg, #eef4ff, #f7faff);
			min-height: 100vh;
		}

		.login-card {
			width: min(92%, 420px);
			margin: 60px auto;
			background: #ffffff;
			padding: 24px;
			border-radius: 10px;
			box-shadow: 0 8px 24px rgba(30, 58, 138, 0.08);
			text-align: left;
		}

		.login-card h2 {
			margin: 0 0 18px;
			color: #1E3A8A;
			text-align: center;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			margin-bottom: 6px;
			font-weight: 600;
			font-size: 16px;
		}

		.form-group input {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid #c7d7f5;
			border-radius: 6px;
			box-sizing: border-box;
		}

		.form-group input:focus {
			outline: none;
			border-color: #1E3A8A;
			box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.14);
		}

		.btn-login {
			width: 100%;
			padding: 11px;
			border: none;
			border-radius: 6px;
			background: #1E3A8A;
			color: #ffffff;
			font-size: 16px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.btn-login:hover {
			background: #152d6b;
			transform: translateY(-1px);
			box-shadow: 0 4px 12px rgba(30, 58, 138, 0.28);
		}

		.btn-login:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

        a {
        	display: inline-block;
        	padding: 10px 20px;
        	background-color: #dbe7ff;
        	color: #1E3A8A;
        	text-decoration: none;
        	border-radius: 6px;
        	transition: all 0.2s ease;
        }

        a:hover {
        	background-color: #c7d7f5;
        }
	</style>
</head>
<body>
	<div class="login-card">
       
		<h2>Police Login</h2>

		<form id="loginForm">
			

			<div class="form-group">
				<label for="username">Username</label>
				<input type="text" id="username" name="username" autocomplete="username" required>
			</div>

			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" required>
			</div>

			<p id="loginMessage" style="margin: 0 0 14px; font-size: 14px;"></p>

			<button type="submit" class="btn-login">Login</button>
            

		</form>
	</div>
</body>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
	import {
		getFirestore,
		collection,
		query,
		where,
		limit,
		getDocs
	} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
	import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCr5xSS_xPQO38JHoZMufQl-HEltwCvqSk",
    authDomain: "complaint-management-sys-f5d5e.firebaseapp.com",
    projectId: "complaint-management-sys-f5d5e",
    storageBucket: "complaint-management-sys-f5d5e.firebasestorage.app",
    messagingSenderId: "697751596289",
    appId: "1:697751596289:web:cd218934e92411bd7a7f00"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);
	const auth = getAuth(app);

	const loginForm = document.getElementById("loginForm");
	const usernameInput = document.getElementById("username");
	const passwordInput = document.getElementById("password");
	const loginMessage = document.getElementById("loginMessage");

	function showMessage(text, isSuccess) {
		loginMessage.textContent = text;
		loginMessage.style.color = isSuccess ? "#0f766e" : "#b91c1c";
	}

	loginForm.addEventListener("submit", async (event) => {
		event.preventDefault();

		const username = usernameInput.value.trim().toUpperCase();
		const password = passwordInput.value;
		const loginButton = loginForm.querySelector("button[type='submit']");

		showMessage("", false);
		loginButton.disabled = true;
		loginButton.textContent = "Checking...";

		try {
			const usersRef = collection(db, "users");
			const userQuery = query(
				usersRef,
				where("username", "==", username),
				limit(1)
			);
			const snapshot = await getDocs(userQuery);

			if (snapshot.empty) {
				showMessage("Invalid username or password.", false);
				return;
			}

			if (snapshot.size > 1) {
				showMessage("Duplicate username records found. Contact the system administrator.", false);
				return;
			}

			const userRecord = snapshot.docs[0].data();
			const role = String(userRecord.role || "").toUpperCase();
			const stationID = String(userRecord.stationID || "").trim();
			const authEmail = String(userRecord.authEmail || "").trim().toLowerCase();

			if (userRecord.active !== true || !authEmail || !stationID || !["ADMIN", "OIC"].includes(role)) {
				showMessage("This account is not configured for access.", false);
				return;
			}

			await signInWithEmailAndPassword(auth, authEmail, password);

			const policeStationsRef = collection(db, "police_stations");
			const stationQuery = query(policeStationsRef, where("stationID", "==", stationID), limit(1));
			const stationSnapshot = await getDocs(stationQuery);
			const stationRecord = stationSnapshot.empty ? {} : stationSnapshot.docs[0].data();

			localStorage.setItem("policeStationID", stationID);
			localStorage.setItem("stationName", stationRecord.stationName ?? "");
			localStorage.setItem("policeStationName", stationRecord.stationName ?? "");
			localStorage.setItem("policeUserRole", role);
			localStorage.setItem("policeUsername", username);
			localStorage.setItem("policeAuthEmail", authEmail);

			// Show success alert
			alert("Login Successful! Welcome to the Police Dashboard.");
			window.location.assign("policeDashboard.html");
		} catch (error) {
			console.error("Login error:", error);
			const authErrorMessages = {
				"auth/invalid-credential": "Incorrect password or Firebase Authentication email.",
				"auth/user-not-found": "This Firebase Authentication account does not exist.",
				"auth/wrong-password": "Incorrect password.",
				"auth/invalid-email": "The authEmail in the users record is invalid.",
				"auth/network-request-failed": "Network error. Check your internet connection."
			};
			if (error.code === "permission-denied") {
				showMessage("Firestore denied access to the users collection. Update the Firebase rules.", false);
			} else {
				showMessage(authErrorMessages[error.code] || `Login failed (${error.code || "unknown error"}). Check the username, password, and Firebase project.`, false);
			}
		} finally {
			loginButton.disabled = false;
			loginButton.textContent = "Login";
		}
	});
</script>



</html>
